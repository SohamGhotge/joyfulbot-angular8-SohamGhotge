<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-4">Register</h3>
          <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
          <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" class="form-control" formControlName="name" [ngClass]="{'is-invalid': name.invalid && name.touched}">
              <div class="invalid-feedback" *ngIf="name.errors?.required && name.touched">Name is required.</div>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" class="form-control" formControlName="email" [ngClass]="{'is-invalid': email.invalid && email.touched}">
              <div class="invalid-feedback" *ngIf="email.errors?.required && email.touched">Email is required.</div>
              <div class="invalid-feedback" *ngIf="email.errors?.email && email.touched">Enter a valid email.</div>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" class="form-control" formControlName="password" [ngClass]="{'is-invalid': password.invalid && password.touched}">
              <div class="invalid-feedback" *ngIf="password.errors?.required && password.touched">Password is required.</div>
              <div class="invalid-feedback" *ngIf="password.errors?.minlength && password.touched">Minimum 6 characters.</div>
            </div>
            <div class="form-group">
              <label>Confirm Password</label>
              <input type="password" class="form-control" formControlName="confirmPassword" [ngClass]="{'is-invalid': confirmPassword.invalid && confirmPassword.touched}">
              <div class="invalid-feedback" *ngIf="confirmPassword.errors?.passwordMatch && confirmPassword.touched">Passwords do not match.</div>
            </div>
            <button type="submit" class="btn btn-success btn-block" [disabled]="registerForm.invalid || isLoading">
              {{ isLoading ? 'Registering...' : 'Register' }}
            </button>
          </form>
          <p class="text-center mt-3">Already have an account? <a routerLink="/auth/login">Login</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
