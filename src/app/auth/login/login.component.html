<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-4">Login</h3>
          <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <label>Email</label>
              <input type="email" class="form-control" formControlName="email" [ngClass]="{'is-invalid': email.invalid && email.touched}">
              <div class="invalid-feedback" *ngIf="email.errors?.required && email.touched">Email is required.</div>
              <div class="invalid-feedback" *ngIf="email.errors?.email && email.touched">Enter a valid email.</div>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" class="form-control" formControlName="password" [ngClass]="{'is-invalid': password.invalid && password.touched}">
              <div class="invalid-feedback" *ngIf="password.errors?.required && password.touched">Password is required.</div>
              <div class="invalid-feedback" *ngIf="password.errors?.minlength && password.touched">Minimum 6 characters.</div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid || isLoading">
              {{ isLoading ? 'Logging in...' : 'Login' }}
            </button>
          </form>
          <p class="text-center mt-3">Don't have an account? <a routerLink="/auth/register">Register</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
