<div class="card h-100 shadow-sm">
  <img [src]="course.image" class="card-img-top" [alt]="course.title">
  <div class="card-body d-flex flex-column">
    <span class="badge badge-secondary mb-2">{{ course.category }}</span>
    <h5 class="card-title">{{ course.title }}</h5>
    <p class="card-text text-muted small">{{ course.description | truncate:80 }}</p>
    <div class="mt-auto">
      <p class="mb-1"><small><strong>Instructor:</strong> {{ course.instructor }}</small></p>
      <p class="mb-2"><small><strong>Duration:</strong> {{ course.duration }}</small></p>
      <div class="d-flex justify-content-between">
        <a [routerLink]="['/courses', course.id]" class="btn btn-outline-primary btn-sm">View Details</a>
        <button class="btn btn-primary btn-sm" (click)="onEnroll()">Enroll</button>
      </div>
    </div>
  </div>
</div>
