<div class="container mt-4">
  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>
  <div *ngIf="!isLoading && course">
    <button class="btn btn-outline-secondary mb-3" routerLink="/courses">← Back to Courses</button>
    <div class="card shadow">
      <img [src]="course.image" class="card-img-top" style="max-height:300px; object-fit:cover" [alt]="course.title">
      <div class="card-body">
        <span class="badge badge-secondary mb-2">{{ course.category }}</span>
        <span class="badge badge-info ml-2 mb-2">{{ course.level }}</span>
        <h2 class="card-title">{{ course.title }}</h2>
        <p class="text-muted">{{ course.description }}</p>
        <hr>
        <p><strong>Instructor:</strong> {{ course.instructor }}</p>
        <p><strong>Duration:</strong> {{ course.duration }}</p>
        <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
        <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
        <button class="btn btn-primary btn-lg" (click)="enroll()">Enroll Now</button>
      </div>
    </div>
  </div>
</div>
